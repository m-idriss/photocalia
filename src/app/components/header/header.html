<header class="app-header">
  <div class="header-content">
    <a routerLink="/" class="logo">
      <svg class="logo-icon" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M256 48C141.31 48 48 141.31 48 256s93.31 208 208 208 208-93.31 208-208S370.69 48 256 48zm0 384c-97.05 0-176-78.95-176-176S158.95 80 256 80s176 78.95 176 176-78.95 176-176 176z" fill="currentColor"/>
        <path d="M160 120c-20 0-36 16-36 36s16 36 36 36c10.4 0 19.8-4.4 26.4-11.4-3.8-16.6-5.4-34-5.4-52C174.8 124.4 167.8 120 160 120z" fill="currentColor"/>
        <path d="M352 120c-7.8 0-14.8 4.4-21 8.6 0 18-1.6 35.4-5.4 52 6.6 7 16 11.4 26.4 11.4 20 0 36-16 36-36s-16-36-36-36z" fill="currentColor"/>
        <path d="M256 380c-20 0-36 16-36 36s16 36 36 36 36-16 36-36-16-36-36-36z" fill="currentColor"/>
        <circle cx="196" cy="236" r="56" fill="currentColor"/>
        <circle cx="196" cy="236" r="20" fill="#FFFFFF"/>
        <circle cx="316" cy="236" r="56" fill="currentColor"/>
        <circle cx="316" cy="236" r="20" fill="#FFFFFF"/>
        <path d="M256 280l-24 32h48l-24-32z" fill="currentColor"/>
      </svg>
      <span class="logo-text">PhotoCalia</span>
    </a>
    <nav class="nav-menu">
      <!-- Sign In Button (when not authenticated) -->
      @if (!isAuthenticated && !isAuthLoading) {
        <button
          class="sign-in-button"
          (click)="signIn()"
          aria-label="Sign in with Google"
          appTooltip="Sign in with Google"
          appTooltipPlacement="bottom"
        >
          <i class="fab fa-google" aria-hidden="true"></i>
          <span>Sign In</span>
        </button>
      }

      <!-- Burger Menu -->
      <div class="burger-menu" [class.active]="menuOpen" aria-label="Settings menu">
        <button
          class="burger-button"
          [class.active]="menuOpen"
          (click)="toggleMenu()"
          aria-label="Open settings menu"
          [attr.aria-expanded]="menuOpen"
          aria-haspopup="true"
          appTooltip="Settings"
          appTooltipPlacement="bottom"
        >
          @if (isAuthenticated && currentUser) {
            <img
              [src]="currentUser.photoURL"
              [alt]="currentUser.displayName || 'User avatar'"
              class="user-avatar"
            />
          } @else {
            <i class="fas fa-ellipsis-v" aria-hidden="true"></i>
          }
        </button>

        <!-- Dropdown menu -->
        @if (menuOpen) {
          <div class="profile-dropdown" role="menu" aria-label="Settings">
            @if (isAuthenticated && currentUser) {
              <div class="user-info">
                <div class="user-details">
                  <div class="user-name">{{ currentUser.displayName }}</div>
                  <div class="user-email">{{ currentUser.email }}</div>
                </div>
              </div>

              <div class="dropdown-separator" role="separator"></div>
            }

            <a
              routerLink="/"
              class="dropdown-item"
              role="menuitem"
              (click)="closeMenu()"
              [appTooltip]="'Go to home page'"
              appTooltipPlacement="left"
            >
              <i class="fas fa-home" aria-hidden="true"></i>
              <span>Home</span>
            </a>

            <div class="dropdown-separator" role="separator"></div>

            <a
              routerLink="/how-it-works"
              class="dropdown-item"
              role="menuitem"
              (click)="closeMenu()"
              [appTooltip]="'Learn how it works'"
              appTooltipPlacement="left"
            >
              <i class="fas fa-info-circle" aria-hidden="true"></i>
              <span>How It Works</span>
            </a>

            @if (isAuthenticated) {
              <div class="dropdown-separator" role="separator"></div>

              <button
                class="dropdown-item sign-out btn btn-danger"
                role="menuitem"
                (click)="signOut()"
                [appTooltip]="'Sign out of your account'"
                appTooltipPlacement="left"
              >
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                <span>Sign Out</span>
              </button>
            }
          </div>
        }
      </div>
    </nav>
  </div>
</header>
