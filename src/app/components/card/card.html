<article class="container" [attr.aria-labelledby]="title ? 'card-title-' + title : null">
  @if (badge && badge > 0) {
    <span class="card-badge" aria-label="{{ badge }} events">{{ badge }}</span>
  }
  @if (title) {
    <div class="card-header">
      <h3 [id]="'card-title-' + title">{{ title }}</h3>
      @if (showCollapseButton) {
        <button
          class="collapse-btn"
          (click)="onCollapseClick()"
          [attr.aria-label]="'Collapse ' + title"
          [attr.aria-expanded]="true"
          [appTooltip]="'Collapse ' + title"
          appTooltipPlacement="top"
          type="button"
        >
          <span aria-hidden="true">−</span>
        </button>
      }
    </div>
  }
  <ng-content></ng-content>
</article>
