<section class="coffee-section" aria-labelledby="coffee-heading">
  <div class="coffee-header">
    <h3 id="coffee-heading" class="coffee-heading">{{ 'coffee.heading' | translate }}</h3>
    <p class="coffee-subheading">{{ 'coffee.subheading' | translate }}</p>
  </div>

  <div class="coffee-tiers" role="list" [attr.aria-label]="'coffee.aria.support' | translate">
    @for (tier of tiers; track tier.labelKey) {
      <button type="button" class="coffee-tier" role="listitem" (click)="openTier(tier.url)">
        <span class="tier-emoji" aria-hidden="true">{{ tier.emojiKey | translate }}</span>
        <span class="tier-label">{{ tier.labelKey | translate }}</span>
        <span class="tier-amount">{{ tier.amountKey | translate }}</span>
      </button>
    }
  </div>
</section>
