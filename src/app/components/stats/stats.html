<section class="stats-section" aria-label="Platform Statistics">
  <div class="stats-container">
    <!-- Stats Content -->
    <div class="stats-content">
      <h2 class="stats-title">
        <span class="stats-icon" aria-hidden="true">📊</span>
        {{ 'stats.title' | translate }}
      </h2>
      @if (!loading() && !hasError()) {
        <p class="stats-tagline" [innerHTML]="t('stats.tagline', { events: '<strong>' + formatNumber(displayEventCount()) + '</strong>', files: '<strong>' + formatNumber(displayFileCount()) + '</strong>' })"></p>

        <p class="stats-time-saved" [innerHTML]="t('stats.timeSaved', { hours: '<strong>~' + formatNumber(timeSavedHours()) + '</strong>' }) + '<br />' + t('stats.workdays', { workdays: '<strong>' + formatNumber(timeSavedWorkdays()) + '</strong>' })"></p>
      }
    </div>

    <!-- Error State -->
    @if (!loading() && hasError()) {
      <div class="stats-error">
        <span class="error-icon" aria-hidden="true">⚠️</span>
        <p>{{ 'stats.error' | translate }}</p>
      </div>
    }
  </div>
</section>
