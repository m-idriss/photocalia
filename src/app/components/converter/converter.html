<app-card id="converter" [title]="'converter.title' | translate" [badge]="extractedEvents().length">
  <!-- Auth Required Message (when not authenticated) -->
  @if (!isAuthLoading && !isAuthenticated) {
    <section
      class="auth-required clickable"
      aria-labelledby="auth-heading"
      (click)="signIn()"
      role="button"
      tabindex="0"
      (keydown.enter)="signIn()"
      (keydown.space)="signIn()"
    >
      <div class="auth-message">
        <h3 id="auth-heading" class="sr-only no-after">AI Calendar Converter</h3>
        <img
          src="/assets/images/converter.svg"
          alt="Calendar converter illustration"
          class="auth-image"
          width="1536"
          height="1024"
          loading="eager"
          fetchpriority="high"
          appTooltip="AI calendar conversion, sign-in to get started"
          appTooltipPlacement="bottom"
        />
      </div>
    </section>
  }

  <!-- Loading State -->
  @if (isAuthLoading) {
    <div class="auth-loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>{{ 'converter.loading' | translate }}</p>
    </div>
  }

  <!-- Converter UI (only shown when authenticated) -->
  @if (!isAuthLoading && isAuthenticated) {
    <!-- Upload Area - Only show if no events extracted -->
    @if (extractedEvents().length === 0) {
      <app-converter-upload
        [files]="files()"
        [thumbnailUrls]="thumbnailUrls()"
        [preview]="previewFile()"
        [dragging]="isDragging()"
        [processing]="isProcessing()"
        (fileSelectionChanged)="onFileSelect($event)"
        (dragOver)="onDragOver($event)"
        (dragLeave)="onDragLeave($event)"
        (filesDropped)="onDrop($event)"
        (removeRequested)="removeFile($event)"
        (previewRequested)="openPreview($event)"
        (previewClosed)="closePreview()"
        (conversionRequested)="convertToIcs()"
      />

      <app-converter-batch-progress
        [files]="batchFiles()"
        [processing]="isProcessing()"
        [batchMode]="isBatchMode()"
        [collapsed]="isBatchDetailsCollapsed()"
        (collapsedChanged)="isBatchDetailsCollapsed.set($event)"
        (retryRequested)="retryFile($event)"
      />
    }

    <!-- Extracted Events - Apple Calendar Style with Editing -->
    @if (extractedEvents().length > 0) {
      <app-converter-event-review
        [events]="extractedEvents()"
        (openCalendarRequested)="openCalendarView()"
        (eventDateRequested)="navigateToEventDate($event)"
        (editRequested)="editEvent($event)"
        (deleteRequested)="deleteEvent($event)"
        (saveRequested)="saveEvent($event)"
        (cancelRequested)="cancelEdit($event)"
        (fieldChanged)="updateEventField($event.index, $event.field, $event.value)"
      />

      <app-converter-export-actions
        [confirmed]="extractionConfirmed()"
        [showContributionNudge]="showContributionNudge()"
        (confirmedChanged)="onExtractionConfirmed($event)"
        (downloadRequested)="downloadIcs()"
        (resetRequested)="resetState()"
        (nudgeDismissed)="dismissContributionNudge()"
      />
    }
  }
</app-card>
