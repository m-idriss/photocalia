name: Security Audit
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Test audit report validation
        run: node --test scripts/check-security-audit.test.mjs
      - name: Audit locked dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          audit_status=0
          npm audit --package-lock-only --ignore-scripts --json > audit.json 2>/dev/null || audit_status=$?
          if (( audit_status > 1 )); then
            echo 'Dependency audit command failed; refusing a passing result.'
            exit 1
          fi
          node scripts/check-security-audit.mjs audit.json
