name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        id: run-audit
        run: |
          npm audit --json > audit.json 2>&1 || true
          # Inspect audit.json and fail only if any advisory has severity 'high' or 'critical'
          node -e "const fs=require('fs');const p='audit.json';let out='';try{out=fs.readFileSync(p,'utf8')}catch(e){console.error('No audit output');process.exit(0);}const lines=out.split(/\n/).filter(Boolean);let high=false;for(const l of lines){try{const j=JSON.parse(l);const adv=j.advisory||j.data?.advisory||j;const sev=(adv&&adv.severity)||null;if(sev&&['high','critical'].includes(String(sev).toLowerCase())){high=true;break;}}catch(e){} }if(high){console.error('High/critical vulnerabilities found');process.exit(1);}console.log('No high/critical vulnerabilities found');process.exit(0);"
