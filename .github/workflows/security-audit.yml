name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies (yarn)
        run: yarn install --frozen-lockfile

      - name: Run security audit (auto-detect lockfile)
        id: run-audit
        run: |
          echo "Detecting lockfile..."
          if [ -f yarn.lock ]; then
            echo "yarn.lock detected — running yarn audit"
            yarn audit --level=high
          elif [ -f package-lock.json ]; then
            echo "package-lock.json detected — running npm audit"
            # ensure node_modules consistent with package-lock
            npm ci
            npm audit --omit=dev --audit-level=high
          else
            echo "No lockfile detected — generating package-lock.json and running npm audit (best-effort)"
            # create a package-lock to satisfy audit, but don't install full deps again
            npm i --package-lock-only
            npm audit --omit=dev --audit-level=high || true
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Security Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f yarn.lock ]; then
            yarn audit --level=high 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
          elif [ -f package-lock.json ]; then
            npm audit --omit=dev --audit-level=high 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No lockfile: generated package-lock and ran npm audit (see logs)" >> "$GITHUB_STEP_SUMMARY"
          fi
