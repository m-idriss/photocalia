name: 📸 Update Screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  screenshots:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect frontend changes since last screenshot update
        id: changes
        run: |
          set -euo pipefail

          SCREENSHOT_PATH="public/assets/screenshots/iPhone_13_Pro_Max.jpeg"
          LAST_SCREENSHOT_COMMIT=$(git log -n 1 --format=%H -- "$SCREENSHOT_PATH" || true)

          if [ -z "$LAST_SCREENSHOT_COMMIT" ]; then
            echo "No existing screenshot commit found. Running screenshot update."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FRONTEND_CHANGES=$(git diff --name-only "$LAST_SCREENSHOT_COMMIT"..HEAD -- \
            src \
            public \
            angular.json \
            package.json \
            package-lock.json \
            tsconfig.json \
            tsconfig.app.json \
            tsconfig.spec.json | grep -v '^public/assets/screenshots/' || true)

          if [ -z "$FRONTEND_CHANGES" ]; then
            echo "No frontend-impacting changes since last screenshot update. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Detected frontend-impacting changes:"
            echo "$FRONTEND_CHANGES"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.should_run == 'true'
        run: npm ci

      - name: Build application
        if: steps.changes.outputs.should_run == 'true'
        run: npm run build

      - name: Install Playwright Chromium
        if: steps.changes.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Start server in background
        if: steps.changes.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          python3 -m http.server 4200 --bind 127.0.0.1 --directory dist/photocalia/browser \
            > /tmp/photocalia-screenshot-server.log 2>&1 &

          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200 > /dev/null; then
              echo "Server is responding with HTTP 200"
              exit 0
            fi

            echo "Attempt $i: server not ready yet"
            sleep 1
          done

          cat /tmp/photocalia-screenshot-server.log
          exit 1

      - name: Generate screenshot with Playwright
        if: steps.changes.outputs.should_run == 'true'
        run: npm run screenshots:capture

      - name: Install ImageMagick
        if: steps.changes.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Crop mobile screenshot
        if: steps.changes.outputs.should_run == 'true'
        run: convert screenshots/iPhone_13_Pro_Max.jpeg -crop 1284x2200+0+0 +repage screenshots/iPhone_13_Pro_Max.jpeg

      - name: Verify screenshots have content
        if: steps.changes.outputs.should_run == 'true'
        run: |
          echo "Checking mobile screenshot..."
          GEOMETRY=$(identify -format '%wx%h' screenshots/iPhone_13_Pro_Max.jpeg)
          echo "Mobile screenshot geometry: $GEOMETRY"

          if [ "$GEOMETRY" != "1284x2200" ]; then
            echo "Unexpected screenshot geometry: $GEOMETRY"
            exit 1
          fi

          # Check file sizes to ensure they're not just empty/background images
          MOBILE_SIZE=$(stat -f%z screenshots/iPhone_13_Pro_Max.jpeg 2>/dev/null || stat -c%s screenshots/iPhone_13_Pro_Max.jpeg)

          echo "Mobile screenshot size: $MOBILE_SIZE bytes"

          if [ $MOBILE_SIZE -lt 51200 ]; then
            echo "WARNING: Mobile screenshot seems too small (< 50KB), might be empty"
          fi

          echo "Screenshots verified successfully"

      - name: Compare screenshot against current version
        if: steps.changes.outputs.should_run == 'true'
        id: compare
        run: |
          set -euo pipefail

          CURRENT="public/assets/screenshots/iPhone_13_Pro_Max.jpeg"
          CANDIDATE="screenshots/iPhone_13_Pro_Max.jpeg"

          if [ ! -f "$CURRENT" ]; then
            echo "No existing screenshot found, update required."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare normalized RMSE: 0 = identical, 1 = fully different.
          set +e
          COMPARE_OUTPUT=$(compare -metric RMSE "$CURRENT" "$CANDIDATE" null: 2>&1)
          COMPARE_EXIT=$?
          set -e

          if [ "$COMPARE_EXIT" -eq 2 ]; then
            echo "Image comparison failed: $COMPARE_OUTPUT"
            exit 1
          fi

          DIFF=$(echo "$COMPARE_OUTPUT" | awk -F'[()]' '{print $2}')
          THRESHOLD="0.003"

          echo "Normalized RMSE: $DIFF"
          echo "Threshold: $THRESHOLD"

          if awk -v d="$DIFF" -v t="$THRESHOLD" 'BEGIN { exit !(d > t) }'; then
            echo "Visual change detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No meaningful visual change detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move screenshots into public/assets/screenshots
        if: steps.changes.outputs.should_run == 'true' && steps.compare.outputs.has_changes == 'true'
        run: |
          mkdir -p public/assets/screenshots
          mv screenshots/iPhone_13_Pro_Max.jpeg public/assets/screenshots/

      - name: Create Pull Request to main
        if: steps.changes.outputs.should_run == 'true' && steps.compare.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update screenshots
          branch: update-screenshots-assets
          base: main
          title: Update screenshots
          body: Automated update of screenshots.
          add-paths: public/assets/screenshots/
          labels: ''

      - name: Run required Frontend CI
        if: steps.changes.outputs.should_run == 'true' && steps.compare.outputs.has_changes == 'true' && steps.cpr.outputs.pull-request-number
        run: |
          set -euo pipefail

          gh workflow run frontend-ci.yml --ref update-screenshots-assets

          echo "Waiting for Frontend CI workflow_dispatch run on ${{ steps.cpr.outputs.pull-request-head-sha }}..."
          RUN_ID=""
          for _ in {1..30}; do
            RUN_ID=$(gh run list \
              --workflow frontend-ci.yml \
              --branch update-screenshots-assets \
              --event workflow_dispatch \
              --commit "${{ steps.cpr.outputs.pull-request-head-sha }}" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')

            if [ -n "$RUN_ID" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find the dispatched Frontend CI run for the screenshot PR."
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize screenshot pull request
        if: steps.changes.outputs.should_run == 'true' && steps.compare.outputs.has_changes == 'true' && steps.cpr.outputs.pull-request-number
        run: |
          {
            echo "## Screenshot update ready for review"
            echo
            echo "Frontend CI passed for the generated screenshot."
            echo "Review and merge PR #${{ steps.cpr.outputs.pull-request-number }} after visual approval:"
            echo "${{ steps.cpr.outputs.pull-request-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No-op summary
        if: steps.changes.outputs.should_run != 'true' || steps.compare.outputs.has_changes == 'false'
        run: |
          if [ "${{ steps.changes.outputs.should_run }}" != "true" ]; then
            echo "Skipped: no frontend-impacting changes since last screenshot update."
          else
            echo "Skipped: generated screenshot is visually equivalent to current screenshot."
          fi
