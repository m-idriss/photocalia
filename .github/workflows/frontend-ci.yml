name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Dependency security gate
    uses: ./.github/workflows/security-audit.yml
    permissions:
      contents: read

  frontend:
    name: Lint, test, and build
    needs: [core-journey-qa, dependency-security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require successful QA and dependency audit
        env:
          CORE_QA_RESULT: ${{ needs.core-journey-qa.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-security.result }}
        run: |
          if [ "$CORE_QA_RESULT" != "success" ] || [ "$DEPENDENCY_AUDIT_RESULT" != "success" ]; then
            echo "Core journey QA and dependency auditing must succeed before the required frontend check can pass."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare logs
        run: mkdir -p "${{ runner.temp }}/frontend-ci-logs"

      - name: Verify generated blog artifacts
        shell: bash
        run: |
          set -o pipefail
          npm run blog:check 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/blog-check.log"

      - name: Verify pricing and provider claims
        shell: bash
        run: |
          set -o pipefail
          npm run claims:check 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/claims-check.log"

      - name: Verify golden dataset coverage
        shell: bash
        run: |
          set -o pipefail
          npm run fixtures:check 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/fixtures-check.log"

      - name: Verify backend contract and generated types
        shell: bash
        run: |
          set -o pipefail
          npm run contracts:check 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/contracts-check.log"

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/lint.log"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/unit-tests.log"

      - name: Install Chromium for critical browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run credential-free converter smoke test
        shell: bash
        run: |
          set -o pipefail
          npx playwright test e2e/app.spec.ts --grep "uploads, reviews" 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/converter-smoke.log"

      - name: Verify pricing and credit checkout journeys
        shell: bash
        run: |
          set -o pipefail
          npx playwright test e2e/pricing.spec.ts --workers=1 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/pricing-smoke.log"

      - name: Build production application
        shell: bash
        env:
          FIREBASE_API_KEY: placeholder
          FIREBASE_PROJECT_ID: placeholder
        run: |
          set -o pipefail
          npm run build:ci 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/production-build.log"

      - name: Verify prerendered SEO output
        run: npm run seo:check

      - name: Verify clean working tree
        shell: bash
        run: |
          set -o pipefail
          npm run verify:clean 2>&1 | tee "${{ runner.temp }}/frontend-ci-logs/clean-tree.log"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-ci-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  upstream-contract:
    name: Upstream API contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout frontend revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Test offline comparator
        run: npm run contracts:upstream:test

      - name: Read public backend contract at one exact commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFile, appendFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const limit = 1024 * 1024;
          async function read(path, accept) {
            const response = await fetch('https://api.github.com/repos/m-idriss/3dime-api/' + path, {
              headers: { Accept: accept, Authorization: `Bearer ${process.env.GH_TOKEN}` },
              signal: AbortSignal.timeout(15000), redirect: 'error',
            });
            if (!response.ok || !response.body) throw new Error('Upstream request failed');
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body) {
              size += chunk.byteLength;
              if (size > limit) throw new Error('Upstream input exceeds the byte limit');
              chunks.push(chunk);
            }
            return Buffer.concat(chunks);
          }
          try {
            const ref = JSON.parse((await read('git/ref/heads/main', 'application/vnd.github+json')).toString('utf8'));
            const commit = { sha: ref.object?.type === 'commit' ? ref.object.sha : undefined };
            if (!/^[a-f0-9]{40}$/.test(commit.sha)) throw new Error('Invalid backend commit');
            await appendFile(process.env.GITHUB_OUTPUT, `sha=${commit.sha}\n`);
            const contract = await read(`contents/contracts/openapi-v1.json?ref=${commit.sha}`, 'application/vnd.github.raw+json');
            await writeFile(join(process.env.RUNNER_TEMP, 'upstream-openapi-v1.json'), contract);
          } catch {
            console.error('Unable to collect bounded backend evidence; no fallback or API response body logged.');
            process.exitCode = 1;
          }
          NODE

      - name: Compare frontend snapshot with upstream evidence
        id: compare
        run: npm run contracts:upstream -- contracts/3dime-api/openapi-v1.json "$RUNNER_TEMP/upstream-openapi-v1.json"

      - name: Report compared revisions and reproduction
        if: always()
        env:
          FRONTEND_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BACKEND_SHA: ${{ steps.upstream.outputs.sha }}
          COMPARISON: ${{ steps.compare.outcome }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo '## Upstream API contract drift'
            echo "Job: $JOB_STATUS; comparison: $COMPARISON"
            echo "Frontend: m-idriss/photocalia @ $FRONTEND_SHA"
            echo 'Frontend path: contracts/3dime-api/openapi-v1.json'
            echo "Backend: m-idriss/3dime-api @ ${BACKEND_SHA:-unavailable}"
            echo 'Backend path: contracts/openapi-v1.json'
            echo 'Reproduce using local checkouts of these exact revisions:'
            echo '```sh'
            echo 'npm run contracts:upstream -- contracts/3dime-api/openapi-v1.json ../3dime-api/contracts/openapi-v1.json'
            echo '```'
            echo 'JSON object-key order and whitespace are ignored; array order is significant.'
            echo 'Missing upstream evidence fails the job. No snapshots are updated automatically.'
          } >> "$GITHUB_STEP_SUMMARY"

  core-journey-qa:
    name: Core journey QA (synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed frontend revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Validate existing synthetic fixtures
        run: npm run fixtures:check
      - name: Type-check the QA harness
        run: npx tsc --ignoreConfig --noEmit --target ES2022 --module preserve --moduleResolution bundler --types node --esModuleInterop --skipLibCheck playwright.qa.config.ts e2e/helpers/qa-fixture.ts e2e/core-journeys.qa.spec.ts
      - name: Run local-only synthetic core journeys
        run: npm run qa:core
      - name: Require complete passing inventory and report coverage
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          try {
            const report = JSON.parse(await readFile('test-results/qa/results.json', 'utf8'));
            const cases = [];
            function collect(suites) {
              for (const suite of suites ?? []) {
                for (const spec of suite.specs ?? []) {
                  for (const test of spec.tests ?? []) cases.push({ title: spec.title, ...test });
                }
                collect(suite.suites);
              }
            }
            collect(report.suites);
            const passed = cases.filter(test => test.expectedStatus === 'passed' && test.results?.length === 1 && test.results[0].status === 'passed').length;
            const skipped = cases.filter(test => test.results?.some(result => result.status === 'skipped')).length;
            const failed = cases.length - passed - skipped;
            const complete = cases.length === 10 && passed === 10 && skipped === 0 && failed === 0 && !(report.errors?.length);
            const lines = ['## Core journey QA (synthetic data)', `Tested revision: ${process.env.GITHUB_SHA ?? 'unavailable'}`, `Collected: ${cases.length}; passed: ${passed}; failed: ${failed}; skipped: ${skipped}`, '', '| Scenario | Result |', '| --- | --- |'];
            for (const test of cases) {
              const title = test.title.replace(/[|\r\n]/g, ' ');
              const status = test.results?.map(result => result.status).join(', ') || 'not run';
              lines.push(`| ${title} | ${status} |`);
            }
            lines.push('', 'Synthetic identity and API responses only; no provider login, model accuracy, payment processing, or production execution is claimed.');
            await appendFile(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            if (!complete) { console.error('QA qualification failed: expected exactly 10 passing, unskipped cases and no run errors.'); process.exitCode = 1; }
          } catch {
            await appendFile(process.env.GITHUB_STEP_SUMMARY, 'QA report missing or invalid; this run is not qualified.\n');
            console.error('QA report missing or invalid.');
            process.exitCode = 1;
          }
          NODE
      - name: Retain synthetic QA evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-core-qa-${{ github.run_id }}
          path: |
            test-results/qa/results.json
            test-results/qa/artifacts/**/synthetic-network-summary*.json
            test-results/qa/artifacts/**/*.png
            playwright-report/qa/
          if-no-files-found: ignore
          retention-days: 3
