version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: daily

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # FullCalendar 7 requires migrating the v6 plugins and locale/event APIs.
    ignore:
      - dependency-name: '@fullcalendar/*'
        update-types: ['version-update:semver-major']
      # Angular 22.2 requires TypeScript <6.1; OpenAPI generation also fails on 7.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0 <8.0.0']
      # Jasmine 7 makes globals read-only, breaking zone.js/testing patches.
      - dependency-name: 'jasmine-core'
        versions: ['>=7.0.0 <8.0.0']
    groups:
      angular:
        patterns:
          - '@angular/*'
        exclude-patterns:
          - '@angular/fire'
      angular-security:
        applies-to: security-updates
        patterns:
          - '@angular/*'
        exclude-patterns:
          - '@angular/fire'
      fullcalendar:
        patterns:
          - '@fullcalendar/*'
